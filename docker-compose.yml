version: "3.9"

# 定义网络
networks:
  dot_store_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 定义卷
volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local

# 定义服务
services:
  # PostgreSQL 数据库服务
  db:
    image: postgres:14
    container_name: dot_store_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dot_store}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dot_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # API 后端服务
  api:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_api
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 前端应用服务
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: dot_store_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      REACT_APP_API_URL: http://${API_HOST:-localhost}:${API_PORT:-8000}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
