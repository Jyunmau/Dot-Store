version: "3.9"

# 定义网络
networks:
  dot_store_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# 定义卷
volumes:
  postgres_data:
    driver: local
  api_logs:
    driver: local
  consul_data:
    driver: local
  rabbitmq_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  elasticsearch_data:
    driver: local
  kibana_data:
    driver: local

# 定义服务
services:
  # ======================================
  # 基础设施服务
  # ======================================
  
  # PostgreSQL 数据库服务
  db:
    image: postgres:14
    container_name: dot_store_db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-dot_store}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dot_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # Consul 服务发现
  consul:
    image: consul:1.15
    container_name: dot_store_consul
    ports:
      - "8500:8500"
      - "8600:8600/udp"
    volumes:
      - consul_data:/consul/data
    command: agent -server -bootstrap-expect=1 -ui -client=0.0.0.0
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: dot_store_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin}
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # ======================================
  # 监控和日志服务
  # ======================================
  
  # Prometheus 监控
  prometheus:
    image: prom/prometheus:latest
    container_name: dot_store_prometheus
    ports:
      - "9090:9090"
    volumes:
      - prometheus_data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # Grafana 可视化
  grafana:
    image: grafana/grafana:9.5.15
    container_name: dot_store_grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # Elasticsearch 日志存储
  elasticsearch:
    image: elasticsearch:8.8.2
    container_name: dot_store_elasticsearch
    ports:
      - "9200:9200"
      - "9300:9300"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
      - xpack.security.enabled=false
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # Kibana 日志分析
  kibana:
    image: kibana:8.8.2
    container_name: dot_store_kibana
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5601/api/status || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "512M"

  # ======================================
  # 业务服务
  # ======================================
  
  # API 网关服务
  api-gateway:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_api_gateway
    ports:
      - "${API_GATEWAY_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
    depends_on:
      - db
      - consul
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 订单服务
  order-service:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_order_service
    ports:
      - "${ORDER_SERVICE_PORT:-8001}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
    depends_on:
      - db
      - consul
      - rabbitmq
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 账务服务
  ledger-service:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_ledger_service
    ports:
      - "${LEDGER_SERVICE_PORT:-8002}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
    depends_on:
      - db
      - consul
      - rabbitmq
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 事件服务
  event-service:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_event_service
    ports:
      - "${EVENT_SERVICE_PORT:-8003}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
    depends_on:
      - db
      - consul
      - rabbitmq
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 配置服务
  config-service:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_config_service
    ports:
      - "${CONFIG_SERVICE_PORT:-8004}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
    depends_on:
      - db
      - consul
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 报表服务
  report-service:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_report_service
    ports:
      - "${REPORT_SERVICE_PORT:-8005}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin}@rabbitmq:5672/
    depends_on:
      - db
      - consul
      - rabbitmq
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 认证服务
  auth-service:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_auth_service
    ports:
      - "${AUTH_SERVICE_PORT:-8006}:8000"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-dot_store}
      APP_DEBUG: ${APP_DEBUG:-false}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CONSUL_URL: http://consul:8500
    depends_on:
      - db
      - consul
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: "1G"

  # 前端应用服务
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: dot_store_frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      REACT_APP_API_URL: http://${API_GATEWAY_HOST:-localhost}:${API_GATEWAY_PORT:-8000}
    depends_on:
      - api-gateway
    networks:
      - dot_store_network
    restart: always
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
