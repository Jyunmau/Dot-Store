version: "3.9"

services:
  db:
    image: postgres:14
    container_name: dot_store_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dot_store
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  api:
    build:
      context: .
      dockerfile: ./apps/api-server/Dockerfile
    container_name: dot_store_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/dot_store
    depends_on:
      - db
    restart: always

volumes:
  postgres_data:
