# 定义网络
networks:
  frontend-network:
    driver: bridge

# 定义卷
volumes:
  # 用于开发环境的代码卷
  frontend-code:
    driver: local
    driver_opts:
      type: none
      device: .
      o: bind

# 定义服务
services:
  # 开发环境服务
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - frontend-code:/app
      # 忽略 node_modules 目录，使用容器内的依赖
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://localhost:8000
    networks:
      - frontend-network
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 生产环境服务
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: frontend-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - frontend-network
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
