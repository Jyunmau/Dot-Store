# 定义网络
networks:
  frontend-network:
    driver: bridge

# 定义服务
services:
  # 生产环境服务
  frontend-prod:
    build:
      context: .
      dockerfile: Dockerfile.simplified
    container_name: frontend-prod
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - frontend-network
    restart: unless-stopped
    # 健康检查
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"